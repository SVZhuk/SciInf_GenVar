[project]
name = "genomic-variant-analysis"
version = "0.1.0"
description = "Genomic Variant Analysis Platform API"
authors = [
    {name = "SVZhuk",email = "15237898+SVZhuk@users.noreply.github.com"}
]
requires-python = ">=3.15"
dependencies = [
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "PT", "T20", "BLE"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.15"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs the Postgres test database (docker compose up -d test_db)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
